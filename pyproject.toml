[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bartrs"
version = "0.2.0"
authors = [
    {name = "Otto Vintola", email="hello@ottovintola.com" },
]
description = "Rust implementation of Bayesian Additive Regression Trees for Probabilistic programming with PyMC"
requires-python = ">=3.10, <3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
readme = "README.md"

dependencies = [
    "numba >= 0.60.0",
    "pymc >= 6.0.1",
    "arviz >= 1.1.0",
    "pymc_bart >= 0.12.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.0.1", "pytest-cov>=6.0.0", "pytest>=8.3.4", "ruff>=0.8.3"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.urls]
Homepage = "https://github.com/pymc-devs/bartrs"
Issues = "https://github.com/pymc-devs/bartrs/issues"